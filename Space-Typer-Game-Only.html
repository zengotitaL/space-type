<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Typer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0f172a}
#fullscreen{position:fixed;right:12px;bottom:12px;z-index:2;border:1px solid #ffffff55;border-radius:8px;background:#0f172acc;color:white;font:24px/1 system-ui;padding:8px 12px;cursor:pointer}
#fullscreen:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<!-- The original game's embed mode removes its surrounding site content.
     The sandbox blocks popups and navigation of the containing page.
     An internet connection is required to load the original game. -->
<iframe id="game" title="Space Typer game" src="https://typinggameskids.com/games/space-typer/?embed=1" sandbox="allow-scripts allow-same-origin" allow="fullscreen; autoplay" allowfullscreen></iframe>
<button id="fullscreen" type="button" title="Fullscreen" aria-label="Enter fullscreen">⛶</button>
<script>
(function(){
  var button=document.getElementById('fullscreen');
  var game=document.getElementById('game');
  button.addEventListener('click',async function(){
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){
        var exit=document.exitFullscreen||document.webkitExitFullscreen;
        if(exit)await exit.call(document);
      }else{
        var enter=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
        if(enter)await enter.call(document.documentElement);
        else button.title='Use your browser fullscreen command (F11 on Windows).';
      }
    }catch(error){button.title='Use your browser fullscreen command (F11 on Windows).';}
    game.focus();
  });
  document.addEventListener('fullscreenchange',function(){
    button.setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');
  });
})();
</script>
</body>
</html>
